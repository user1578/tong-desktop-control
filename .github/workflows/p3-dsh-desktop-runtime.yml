name: P3 DSH Desktop runtime

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  runtime-discovery:
    name: Desktop discovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check scripts/TongDshDesktopRuntime.mjs
          node --check scripts/TongDshS0Audit.mjs
          node --check scripts/TongDshS1Policy.mjs
          node --check scripts/TongDshS1SyntheticRunner.mjs
          node --check scripts/TongDshS1B1SyntheticGrant.mjs
          node --check tests/Test-TongDshS1B1SyntheticGrant.mjs
          node --check scripts/Inspect-TongDshS1Config.mjs
          node --check tests/Test-TongDshS1Policy.mjs
          node --check tests/Test-TongDshS1SyntheticRunner.mjs
          node --check tests/Test-TongDshDesktopRuntime.mjs
          node --check tests/Test-TongDshS0Audit.mjs
      - name: Simulated Desktop installation and path safety
        run: node --test tests/Test-TongDshDesktopRuntime.mjs tests/Test-TongDshS0Audit.mjs tests/Test-TongDshS1Policy.mjs tests/Test-TongDshS1SyntheticRunner.mjs tests/Test-TongDshS1B1SyntheticGrant.mjs
      - name: Windows native DSH Job Object mock canaries (no DSH model)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-TongDshS1BJobObject.ps1
      - name: Windows synthetic restricted-token AccessCheck (no DSH model)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-TongDshS1B1TokenCanary.ps1
