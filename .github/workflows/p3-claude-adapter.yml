name: P3 Claude adapter

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  claude-adapter:
    name: Adapter contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate adapter and contract tests
        run: |
          node --check scripts/TongClaudeCodeAdapter.mjs
          node --check tests/Test-TongClaudeCodeAdapter.mjs
          node --test tests/Test-TongClaudeCodeAdapter.mjs
